<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九九をおぼえて、まちをつくろうゲーム</title>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      text-align: center;
      /* n. 日本語フォントを優先 */
      font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Maru Gothic Pro',
                   'Yu Gothic Medium', 'YuGothic', 'Meiryo',
                   'Comic Sans MS', cursive, sans-serif;
      background-color: #ffebf0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-y: auto;
      margin: 0;
      padding: 10px 0;
    }
    h1 { color: #ff4081; font-size: 1.5em; margin: 5px 0; }

    /* a. ミュートボタン（画面右上に固定／文字ベース） */
    #muteBtn {
      position: fixed;
      top: 10px;
      right: 10px;
      border: 2px solid #ff4081;
      border-radius: 8px;
      background: white;
      color: #ff4081;
      font-family: inherit;
      font-size: 0.95em;
      padding: 6px 12px;
      cursor: pointer;
      z-index: 100;
      line-height: 1.3;
      transition: 0.2s;
    }
    #muteBtn:hover, #muteBtn:focus {
      background-color: #ff80ab;
      color: white;
      outline: none;
    }

    /* モード選択 */
    #modeSelection {
      margin-bottom: 10px;
    }
    #modeSelection h2 {
      font-size: 1.3em;
      color: #ff4081;
      margin-bottom: 10px;
    }
    .mode-btn {
      font-size: 1.1em;
      padding: 12px 20px;
      border: 2px solid #ff4081;
      border-radius: 10px;
      background-color: white;
      color: #ff4081;
      cursor: pointer;
      margin: 5px;
      transition: 0.3s;
      font-family: inherit;
    }
    .mode-btn:hover, .mode-btn:focus {
      background-color: #ff80ab;
      color: white;
    }

    #timeButtons {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
    }

    /* f. 自己ベスト表示 */
    #bestRecord {
      display: none;
      color: #ff4081;
      font-size: 1em;
      margin: 6px 0;
    }

    /* o. リトライ設定 */
    #retryLabel {
      display: none;
      color: #ff4081;
      font-size: 0.95em;
      margin: 8px 0;
      cursor: pointer;
    }
    #retryOption {
      transform: scale(1.3);
      margin-right: 6px;
      vertical-align: middle;
    }

    #timer, #score { font-size: 1.2em; color: #ff4081; }
    #clearGoal { font-size: 1em; color: #ff4081; margin: 2px 0; }
    /* q. ステージ表示 */
    #stageDisplay { font-size: 1em; color: #ff4081; margin: 2px 0; }

    /* c. タイムアタックの経過時間色変化 */
    #taTimer.warn { color: #ff9800; }
    #taTimer.danger { color: #f44336; }
    #taTimer.best { color: #4caf50; font-weight: bold; }

    #question {
      font-size: 1.8em;
      background: #ff80ab;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      display: none;
      margin: 8px;
    }

    /* フィードバック表示 */
    #feedback {
      font-size: 1.3em;
      font-weight: bold;
      min-height: 1.6em;
      margin: 4px 0;
      transition: opacity 0.3s;
    }
    #feedback.correct { color: #4caf50; }
    #feedback.wrong { color: #f44336; }

    #options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 5px 0;
    }
    .option {
      display: inline-block;
      padding: 10px 18px;
      border: 2px solid #ff4081;
      cursor: pointer;
      font-size: 1.5em;
      background: white;
      color: #333;
      border-radius: 10px;
      transition: 0.2s;
      font-family: inherit;
      position: relative;
    }
    .option:active, .option.pressed {
      transform: scale(0.95);
    }
    .option.correct-highlight {
      background-color: #4caf50;
      color: white;
      border-color: #388e3c;
    }
    .option.wrong-highlight {
      background-color: #f44336;
      color: white;
      border-color: #d32f2f;
    }
    /* l. disabled状態の視覚スタイル */
    .option:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .option.correct-highlight:disabled,
    .option.wrong-highlight:disabled {
      opacity: 1;
    }
    .option:focus { outline: 2px solid #ff4081; outline-offset: 2px; }
    /* b. キーボード番号バッジ */
    .option .key-badge {
      position: absolute;
      top: -8px;
      left: -8px;
      background: #ff4081;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.6em;
      line-height: 20px;
      font-weight: bold;
      pointer-events: none;
    }
    @media (hover: none) {
      /* タッチ端末ではキーボードバッジを非表示 */
      .option .key-badge { display: none; }
    }

    #gameOver, #mistakesList {
      display: none;
      font-size: 1.2em;
      color: #ff4081;
      margin-top: 10px;
      padding: 0 10px;
    }
    /* e. 正答率表示 */
    #accuracyDisplay {
      display: none;
      font-size: 1.1em;
      color: #ff4081;
      margin-top: 6px;
    }
    .end-btn {
      display: none;
      font-size: 1.1em;
      padding: 10px 15px;
      border: 2px solid #ff4081;
      background-color: white;
      color: #ff4081;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
    }
    .end-btn:hover, .end-btn:focus { background-color: #ff80ab; color: white; }

    /* k. まち表示の幅を広げる */
    #city {
      width: min(95vw, 700px);
      height: 30vh;
      max-height: 300px;
      margin: 5px auto;
    }
    #city svg {
      width: 100%;
      height: 100%;
    }
    #city img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ヒートマップ */
    #heatmapSection {
      display: none;
      margin: 15px auto;
      padding: 10px;
    }
    #heatmapSection h3 {
      color: #ff4081;
      margin-bottom: 8px;
    }
    .heatmap-table {
      border-collapse: collapse;
      margin: 0 auto;
    }
    .heatmap-table th {
      background: #ff80ab;
      color: white;
      padding: 4px 8px;
      font-size: 0.9em;
      min-width: 32px;
    }
    .heatmap-table td {
      padding: 4px;
      text-align: center;
      font-size: 0.8em;
      border: 1px solid #fce4ec;
      min-width: 32px;
      cursor: default;
    }
    .heatmap-table .row-header {
      background: #ff80ab;
      color: white;
      font-weight: bold;
    }
    .heatmap-legend {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.85em;
      color: #666;
    }
    .legend-box {
      width: 18px;
      height: 18px;
      display: inline-block;
      border: 1px solid #ccc;
      vertical-align: middle;
    }
    /* p. よくある誤答先 */
    .wrong-target { color: #d32f2f; font-size: 0.9em; }

    /* タイムアタック */
    #taProgress {
      font-size: 1.1em;
      color: #ff4081;
    }

    /* d. にがてのみ練習バナー */
    #weakBanner {
      display: none;
      background: #fff3e0;
      color: #e65100;
      padding: 4px 10px;
      border-radius: 6px;
      margin: 4px;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <!-- a. ミュートボタン -->
  <button id="muteBtn" type="button">音をけす</button>

  <h1>九九をおぼえて、まちをつくろうゲーム</h1>

  <!-- モード選択 -->
  <div id="modeSelection">
    <h2>あそびかたをえらぶ</h2>
    <div id="bestRecord">タイムアタック ベスト: <span id="bestTime">0.0</span>びょう</div>
    <div style="margin-bottom:8px; font-size:1.1em; color:#ff4081;">じかんせいげんモード</div>
    <div id="timeButtons">
      <button class="mode-btn" data-time="30">30びょう</button>
      <button class="mode-btn" data-time="60">60びょう</button>
      <button class="mode-btn" data-time="120">120びょう</button>
    </div>
    <div style="margin-top:12px;">
      <button class="mode-btn" id="startTABtn">タイムアタックモード</button>
    </div>
    <div style="margin-top:12px;">
      <button class="mode-btn" id="openHeatmapBtn">九九ひょう（にがてチェック）</button>
    </div>
    <label id="retryLabel">
      <input type="checkbox" id="retryOption">
      まちがえたらすぐもういちど
    </label>
  </div>

  <div id="weakBanner">にがてだけれんしゅう ちゅう</div>
  <div id="timer" style="display:none">のこりじかん: <span id="timeLeft">0</span>びょう</div>
  <div id="taProgress" style="display:none">もんだい: <span id="taCount">0</span> / 81</div>
  <div id="taTimer" style="display:none; font-size:1.2em; color:#ff4081;">タイム: <span id="taTime">0.0</span>びょう</div>
  <div id="score" style="display:none">スコア: <span id="scoreValue">0</span> / 30</div>
  <div id="clearGoal" style="display:none">30問せいかいでクリア！</div>
  <div id="stageDisplay" style="display:none">まち: <span id="stageNum">1</span> / 10</div>
  <div id="question">ここに もんだい が ひょうじ されます</div>
  <!-- m. aria-live でフィードバックを読み上げ対象に -->
  <div id="feedback" aria-live="polite" aria-atomic="true"></div>
  <div id="options" role="group" aria-label="こたえのせんたくし"></div>
  <div id="city"></div>
  <button class="end-btn" id="quitBtn">やめる</button>
  <div id="gameOver">じかんぎれ！</div>
  <div id="accuracyDisplay"></div>
  <div id="mistakesList"></div>
  <button class="end-btn" id="restart">もういちど あそぶ</button>
  <button class="end-btn" id="showHeatmapBtn">九九ひょう（にがてチェック）</button>
  <button class="end-btn" id="resetData">まちがえのきろくをリセット</button>

  <!-- ヒートマップ -->
  <div id="heatmapSection">
    <h3>九九 にがてひょう</h3>
    <div id="heatmapContainer"></div>
    <div class="heatmap-legend">
      <span class="legend-box" style="background:#e8f5e9"></span> まちがえなし
      <span class="legend-box" style="background:#fff9c4"></span> すこし
      <span class="legend-box" style="background:#ffcc80"></span> ちゅうい
      <span class="legend-box" style="background:#ef9a9a"></span> にがて
    </div>
    <br>
    <button class="mode-btn" id="weakOnlyBtn">にがてだけれんしゅう（60びょう）</button>
    <button class="mode-btn" id="hideHeatmapBtn">もどる</button>
  </div>

  <script>
    // ===== h. 定数 =====
    const CONFIG = {
      NORMAL_GOAL: 30,
      CITY_GROWTH_INTERVAL: 3,
      TA_CITY_GROWTH_INTERVAL: 9,
      MAX_STAGE: 10,
      TA_TOTAL: 81,
      WEAK_PRACTICE_TIME: 60,
      FEEDBACK_DELAY_CORRECT: 400,
      FEEDBACK_DELAY_WRONG: 1200,
      TA_COLOR_WARN_AT: 30,   // 秒
      TA_COLOR_DANGER_AT: 60, // 秒
      STORAGE_KEYS: {
        mistakes: 'mistakeCounts',
        wrongAnswers: 'wrongAnswers',
        bestTime: 'taBestTime',
        muted: 'isMuted',
        retry: 'retryOnWrong',
      },
    };

    // ===== i. ゲーム状態を1オブジェクトに集約 =====
    const state = {
      mode: null,            // 'normal' | 'timeattack' | null
      timeLeft: 0,
      correct: 0,
      totalAnswers: 0,
      cityStage: 1,
      previous: { num1: null, num2: null },
      ended: false,
      waiting: false,
      // タイムアタック
      taProblems: [],
      taSolved: 0,
      taStartTime: 0,
      // オプション
      retryOnWrong: false,
      weakOnly: false,
      // リトライ用：次回の問題を強制
      forceProblem: null,
    };

    let timerInterval = null;
    let taTimerInterval = null;

    // ===== ストレージユーティリティ =====
    function safeLoad(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    }
    function safeSave(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    }

    // ===== 苦手キー操作ヘルパー =====
    function mistakeKey(i, j) { return `${i}_${j}`; }
    function formatProblem(i, j) { return `${i} × ${j}`; }
    function migrateMistakeKeys(raw) {
      const result = {};
      for (const key in raw) {
        const m = key.match(/^(\d+)\s*[×x]\s*(\d+)$/);
        if (m) result[mistakeKey(m[1], m[2])] = raw[key];
        else if (/^\d+_\d+$/.test(key)) result[key] = raw[key];
      }
      return result;
    }

    let mistakeCounts = migrateMistakeKeys(safeLoad(CONFIG.STORAGE_KEYS.mistakes, {}));
    // p. 誤答パターン: { mistakeKey: { selectedValue: count } }
    let wrongAnswers = safeLoad(CONFIG.STORAGE_KEYS.wrongAnswers, {});

    // ===== a. ミュート =====
    let isMuted = safeLoad(CONFIG.STORAGE_KEYS.muted, false) === true;
    function setMuted(v) {
      isMuted = !!v;
      safeSave(CONFIG.STORAGE_KEYS.muted, isMuted);
      const btn = document.getElementById('muteBtn');
      // ボタンには「次にできる操作」を表示する
      btn.textContent = isMuted ? '音を出す' : '音をけす';
      btn.setAttribute('aria-label', isMuted ? '音を出す' : '音をけす');
    }

    // ===== f. 自己ベスト =====
    function getBestTime() {
      const v = safeLoad(CONFIG.STORAGE_KEYS.bestTime, null);
      return typeof v === 'number' ? v : null;
    }
    function setBestTime(t) { safeSave(CONFIG.STORAGE_KEYS.bestTime, t); }
    function refreshBestRecordDisplay() {
      const t = getBestTime();
      const el = document.getElementById('bestRecord');
      if (t !== null) {
        document.getElementById('bestTime').textContent = t.toFixed(1);
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    // ===== 音声 =====
    let audioCtx = null;
    function ensureAudioContext() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          return null;
        }
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }
    const loadedAudioFiles = {};
    ['correct', 'wrong', 'fanfare'].forEach(name => {
      const audio = new Audio(`${name}.mp3`);
      audio.preload = 'auto';
      audio.addEventListener('canplaythrough', () => { loadedAudioFiles[name] = audio; }, { once: true });
      audio.addEventListener('error', () => { /* mp3なし → 合成音にフォールバック */ });
      audio.load();
    });

    // 合成音（mp3が無い時のフォールバック）
    const synthDefs = {
      correct: [
        { freq: 880, start: 0, dur: 0.25, type: 'sine', gain: 0.3 },
        { freq: 1108.73, start: 0.08, dur: 0.4, type: 'sine', gain: 0.25 },
        { freq: 880, start: 0.08, dur: 0.4, type: 'sine', gain: 0.15 },
      ],
      wrong: [
        { freq: 150, start: 0, dur: 0.2, type: 'square', gain: 0.18 },
        { freq: 120, start: 0, dur: 0.2, type: 'sawtooth', gain: 0.08 },
      ],
      fanfare: [
        { freq: 523.25, start: 0, dur: 0.2, type: 'sine', gain: 0.25 },
        { freq: 523.25, start: 0, dur: 0.2, type: 'triangle', gain: 0.1 },
        { freq: 659.25, start: 0.2, dur: 0.2, type: 'sine', gain: 0.25 },
        { freq: 659.25, start: 0.2, dur: 0.2, type: 'triangle', gain: 0.1 },
        { freq: 783.99, start: 0.4, dur: 0.2, type: 'sine', gain: 0.25 },
        { freq: 783.99, start: 0.4, dur: 0.2, type: 'triangle', gain: 0.1 },
        { freq: 1046.50, start: 0.6, dur: 0.5, type: 'sine', gain: 0.3 },
        { freq: 1046.50, start: 0.6, dur: 0.5, type: 'triangle', gain: 0.12 },
      ],
      // j. やめる音（短い下降2音）
      quit: [
        { freq: 587.33, start: 0, dur: 0.18, type: 'sine', gain: 0.2 },
        { freq: 440.00, start: 0.18, dur: 0.25, type: 'sine', gain: 0.2 },
      ],
    };

    function playSound(name) {
      if (isMuted) return;
      // mp3優先（'quit'はmp3が無いので合成音にフォールバック）
      if (loadedAudioFiles[name]) {
        const audio = loadedAudioFiles[name];
        try { audio.currentTime = 0; } catch (e) {}
        audio.play().catch(() => {});
        return;
      }
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const defs = synthDefs[name];
      if (!defs) return;
      defs.forEach(d => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = d.type;
        osc.frequency.value = d.freq;
        gain.gain.setValueAtTime(d.gain, ctx.currentTime + d.start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d.start + d.dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + d.start);
        osc.stop(ctx.currentTime + d.start + d.dur + 0.05);
      });
    }

    // ===== UI helpers =====
    function show(id, disp) { document.getElementById(id).style.display = disp; }
    function hide(id) { document.getElementById(id).style.display = 'none'; }
    function updateStageDisplay() {
      document.getElementById('stageNum').textContent = state.cityStage;
    }

    // 問題表示の共通処理（previous記録 + 表示 + 選択肢生成）
    function showProblem(num1, num2) {
      state.previous = { num1, num2 };
      document.getElementById('question').textContent = `${num1} × ${num2} = ?`;
      renderOptions(num1 * num2);
    }

    // モードに応じて次の問題を出題
    function nextQuestion() {
      if (state.mode === 'normal') generateQuestion();
      else generateTAQuestion();
    }

    // フィードバック後の遷移を遅延実行
    function scheduleNext(delay) {
      setTimeout(() => {
        state.waiting = false;
        nextQuestion();
      }, delay);
    }

    // ===== 画面遷移 =====
    // 注: 表示/非表示を切り替える要素はすべてここに列挙すること
    const TOGGLEABLE_IDS = [
      'modeSelection', 'timer', 'score', 'clearGoal', 'stageDisplay',
      'taProgress', 'taTimer', 'question', 'quitBtn', 'city',
      'gameOver', 'accuracyDisplay', 'mistakesList',
      'restart', 'showHeatmapBtn', 'resetData',
      'heatmapSection', 'weakBanner',
    ];
    const SCREENS = {
      modeSelect: { modeSelection: 'block', city: 'block' },
      inGameNormal: {
        timer: 'block', score: 'block', clearGoal: 'block',
        stageDisplay: 'block', question: 'inline-block',
        quitBtn: 'inline-block', city: 'block',
      },
      inGameTA: {
        taProgress: 'block', taTimer: 'block',
        stageDisplay: 'block', question: 'inline-block',
        quitBtn: 'inline-block', city: 'block',
      },
      resultNormal: {
        timer: 'block', score: 'block', city: 'block',
        gameOver: 'block', accuracyDisplay: 'block', mistakesList: 'block',
        restart: 'inline-block', showHeatmapBtn: 'inline-block', resetData: 'inline-block',
      },
      resultTA: {
        taProgress: 'block', taTimer: 'block', city: 'block',
        gameOver: 'block', accuracyDisplay: 'block', mistakesList: 'block',
        restart: 'inline-block', showHeatmapBtn: 'inline-block', resetData: 'inline-block',
      },
      heatmap: { heatmapSection: 'block' },
    };
    function goToScreen(name, extras = {}) {
      const visible = { ...SCREENS[name], ...extras };
      TOGGLEABLE_IDS.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = visible[id] || 'none';
      });
    }

    // ===== PNG画像プリロード =====
    const cityImages = {};
    // 各ステージのPNG読み込み状態。'loaded' | 'failed' | undefined（読み込み中）
    const cityImageStatus = {};
    (function preloadCityImages() {
      for (let s = 1; s <= CONFIG.MAX_STAGE; s++) {
        const img = new Image();
        const stage = s;
        img.onload = function() {
          cityImages[stage] = img;
          cityImageStatus[stage] = 'loaded';
          if (state.cityStage === stage) drawCity(stage);
        };
        img.onerror = function() {
          cityImageStatus[stage] = 'failed';
          if (state.cityStage === stage) drawCity(stage);
        };
        img.src = `${String(s).padStart(3, '0')}.png`;
      }
    })();

    // ===== 通常モード開始 =====
    function startNormalGame(time, opts = {}) {
      ensureAudioContext();
      state.mode = 'normal';
      state.timeLeft = time;
      state.correct = 0;
      state.totalAnswers = 0;
      state.ended = false;
      state.waiting = false;
      state.previous = { num1: null, num2: null };
      state.forceProblem = null;
      state.weakOnly = !!opts.weakOnly;

      goToScreen('inGameNormal', state.weakOnly ? { weakBanner: 'inline-block' } : {});

      document.getElementById('timeLeft').textContent = state.timeLeft;
      document.getElementById('scoreValue').textContent = '0';
      updateStageDisplay();
      drawCity(state.cityStage);
      generateQuestion();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (state.ended) return;
      state.timeLeft--;
      document.getElementById('timeLeft').textContent = state.timeLeft;
      if (state.timeLeft <= 0) {
        clearInterval(timerInterval);
        endGame('じかんぎれ！');
      }
    }

    // ===== タイムアタック開始 =====
    function startTimeAttack() {
      ensureAudioContext();
      state.mode = 'timeattack';
      state.ended = false;
      state.waiting = false;
      state.totalAnswers = 0;
      state.previous = { num1: null, num2: null };
      state.weakOnly = false;
      state.forceProblem = null;

      // 全81問をシャッフル
      state.taProblems = [];
      for (let i = 1; i <= 9; i++) {
        for (let j = 1; j <= 9; j++) {
          state.taProblems.push({ num1: i, num2: j });
        }
      }
      for (let i = state.taProblems.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.taProblems[i], state.taProblems[j]] = [state.taProblems[j], state.taProblems[i]];
      }
      state.taSolved = 0;

      goToScreen('inGameTA');
      document.getElementById('taCount').textContent = '0';
      const taTimerEl = document.getElementById('taTimer');
      taTimerEl.classList.remove('warn', 'danger', 'best');
      updateStageDisplay();
      drawCity(state.cityStage);

      state.taStartTime = performance.now();
      taTimerInterval = setInterval(updateTATimer, 100);

      generateTAQuestion();
    }

    // c. タイムアタックの経過時間色変化
    function updateTATimer() {
      const elapsed = (performance.now() - state.taStartTime) / 1000;
      document.getElementById('taTime').textContent = elapsed.toFixed(1);
      const el = document.getElementById('taTimer');
      el.classList.remove('warn', 'danger');
      if (elapsed >= CONFIG.TA_COLOR_DANGER_AT) el.classList.add('danger');
      else if (elapsed >= CONFIG.TA_COLOR_WARN_AT) el.classList.add('warn');
    }

    function generateTAQuestion() {
      if (state.ended) return;
      const problem = state.taProblems[state.taSolved];
      showProblem(problem.num1, problem.num2);
    }

    // ===== 通常モード問題生成 =====
    function generateQuestion() {
      if (state.ended) return;

      // o. 即リトライ：直前の問題を強制
      if (state.forceProblem) {
        const fp = state.forceProblem;
        state.forceProblem = null;
        showProblem(fp.num1, fp.num2);
        return;
      }

      // d. 苦手のみモードでは間違えた問題からのみ出題
      const problems = [];
      const weights = [];
      for (let i = 1; i <= 9; i++) {
        for (let j = 1; j <= 9; j++) {
          const count = mistakeCounts[mistakeKey(i, j)] || 0;
          if (state.weakOnly && count === 0) continue;
          const weight = count + (state.weakOnly ? 0 : 1);
          // weakOnlyではcountをそのまま重みに
          problems.push({ num1: i, num2: j });
          weights.push(state.weakOnly ? Math.max(count, 1) : weight);
        }
      }

      if (problems.length === 0) {
        // 苦手な問題がない場合：通常モードへフォールバック
        state.weakOnly = false;
        document.getElementById('weakBanner').style.display = 'none';
        generateQuestion();
        return;
      }

      let selectedProblem;
      let attempts = 0;
      const totalWeight = weights.reduce((sum, w) => sum + w, 0);
      while (attempts < 10) {
        let r = Math.random() * totalWeight;
        let index = 0;
        for (let k = 0; k < weights.length; k++) {
          r -= weights[k];
          if (r <= 0) { index = k; break; }
        }
        const candidate = problems[index];
        if (candidate.num1 === state.previous.num1 && candidate.num2 === state.previous.num2 && problems.length > 1) {
          attempts++;
          continue;
        }
        selectedProblem = candidate;
        break;
      }
      if (!selectedProblem) {
        do {
          const randomIndex = Math.floor(Math.random() * problems.length);
          selectedProblem = problems[randomIndex];
        } while (
          problems.length > 1 &&
          selectedProblem.num1 === state.previous.num1 &&
          selectedProblem.num2 === state.previous.num2
        );
      }

      showProblem(selectedProblem.num1, selectedProblem.num2);
    }

    // ===== 選択肢生成 =====
    function generateDistractors(correct, num1, num2) {
      const distractors = new Set();
      const candidates = [];
      if (num2 > 1) candidates.push(num1 * (num2 - 1));
      if (num2 < 9) candidates.push(num1 * (num2 + 1));
      if (num1 > 1) candidates.push((num1 - 1) * num2);
      if (num1 < 9) candidates.push((num1 + 1) * num2);
      if (correct >= 10) {
        const reversed = parseInt(String(correct).split('').reverse().join(''));
        if (reversed !== correct && reversed > 0 && reversed <= 81) candidates.push(reversed);
      }
      candidates.push(correct + 1, correct - 1, correct + 2, correct - 2);
      for (let k = 1; k <= 9; k++) {
        if (k !== num2) candidates.push(num1 * k);
        if (k !== num1) candidates.push(k * num2);
      }
      const shuffled = candidates
        .filter(v => v > 0 && v <= 81 && v !== correct)
        .sort(() => Math.random() - 0.5);
      for (const v of shuffled) {
        if (distractors.size >= 3) break;
        distractors.add(v);
      }
      while (distractors.size < 3) {
        const v = (Math.floor(Math.random() * 9) + 1) * (Math.floor(Math.random() * 9) + 1);
        if (v !== correct) distractors.add(v);
      }
      return [...distractors].slice(0, 3);
    }

    function renderOptions(correctAnswer) {
      const distractors = generateDistractors(correctAnswer, state.previous.num1, state.previous.num2);
      const options = [correctAnswer, ...distractors].sort(() => Math.random() - 0.5);

      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      const feedbackEl = document.getElementById('feedback');
      feedbackEl.textContent = '';
      feedbackEl.className = '';

      options.forEach((option, idx) => {
        const button = document.createElement('button');
        button.className = 'option';
        button.dataset.value = option;
        button.setAttribute('aria-label', `こたえ ${option}`);
        // b. キーボード番号バッジ
        const badge = document.createElement('span');
        badge.className = 'key-badge';
        badge.textContent = idx + 1;
        button.appendChild(badge);
        button.appendChild(document.createTextNode(option));
        button.addEventListener('click', () => handleAnswer(option, correctAnswer, optionsDiv));
        optionsDiv.appendChild(button);
      });
    }

    // ===== 回答処理 =====
    function handleAnswer(selected, correct, optionsDiv) {
      if (state.ended || state.waiting) return;

      state.totalAnswers++;
      const feedbackEl = document.getElementById('feedback');
      const buttons = optionsDiv.querySelectorAll('.option');
      state.waiting = true;
      buttons.forEach(btn => { btn.disabled = true; });

      if (selected === correct) {
        playSound('correct');
        buttons.forEach(btn => {
          if (Number(btn.dataset.value) === correct) btn.classList.add('correct-highlight');
        });
        feedbackEl.textContent = '⭕ せいかい！';
        feedbackEl.className = 'correct';

        if (state.mode === 'normal') {
          state.correct++;
          document.getElementById('scoreValue').textContent = state.correct;
          if (state.correct >= CONFIG.NORMAL_GOAL) {
            setTimeout(() => endGame('おめでとう！'), CONFIG.FEEDBACK_DELAY_CORRECT);
            return;
          }
          if (state.correct % CONFIG.CITY_GROWTH_INTERVAL === 0 && state.cityStage < CONFIG.MAX_STAGE) {
            state.cityStage++;
            updateStageDisplay();
            drawCity(state.cityStage);
          }
        } else if (state.mode === 'timeattack') {
          state.correct++;
          state.taSolved++;
          document.getElementById('taCount').textContent = state.taSolved;
          const newStage = Math.min(CONFIG.MAX_STAGE, Math.floor(state.taSolved / CONFIG.TA_CITY_GROWTH_INTERVAL) + 1);
          if (newStage !== state.cityStage) {
            state.cityStage = newStage;
            updateStageDisplay();
            drawCity(state.cityStage);
          }
          if (state.taSolved >= CONFIG.TA_TOTAL) {
            setTimeout(() => {
              clearInterval(taTimerInterval);
              const elapsed = (performance.now() - state.taStartTime) / 1000;
              // f. 自己ベスト判定
              const best = getBestTime();
              const isNewBest = best === null || elapsed < best;
              if (isNewBest) {
                setBestTime(parseFloat(elapsed.toFixed(1)));
                document.getElementById('taTimer').classList.add('best');
              }
              const msg = isNewBest
                ? `クリア！タイム: ${elapsed.toFixed(1)}びょう（じこベスト！）`
                : `クリア！タイム: ${elapsed.toFixed(1)}びょう`;
              endGame(msg);
            }, CONFIG.FEEDBACK_DELAY_CORRECT);
            return;
          }
        }

        scheduleNext(CONFIG.FEEDBACK_DELAY_CORRECT);

      } else {
        playSound('wrong');
        buttons.forEach(btn => {
          const val = Number(btn.dataset.value);
          if (val === selected) btn.classList.add('wrong-highlight');
          if (val === correct) btn.classList.add('correct-highlight');
        });
        feedbackEl.textContent = `❌ ざんねん… こたえは ${correct}`;
        feedbackEl.className = 'wrong';

        // まちがえ記録
        const key = mistakeKey(state.previous.num1, state.previous.num2);
        mistakeCounts[key] = (mistakeCounts[key] || 0) + 1;
        safeSave(CONFIG.STORAGE_KEYS.mistakes, mistakeCounts);
        // p. 誤答パターン記録
        if (!wrongAnswers[key]) wrongAnswers[key] = {};
        wrongAnswers[key][selected] = (wrongAnswers[key][selected] || 0) + 1;
        safeSave(CONFIG.STORAGE_KEYS.wrongAnswers, wrongAnswers);

        if (state.mode === 'normal' && state.cityStage > 1) {
          state.cityStage--;
          updateStageDisplay();
          drawCity(state.cityStage);
        }

        // o. 即リトライ：通常モードのみ（TAは元々間違えた問題が次も出る仕様）
        if (state.retryOnWrong && state.mode === 'normal') {
          state.forceProblem = { num1: state.previous.num1, num2: state.previous.num2 };
        }

        scheduleNext(CONFIG.FEEDBACK_DELAY_WRONG);
      }
    }

    // ===== ゲーム終了 =====
    function quitGame() {
      // j. やめる時はファンファーレでなく短い終了音
      endGame('おつかれさま！', { soundName: 'quit' });
    }

    function endGame(message, opts = {}) {
      state.ended = true;
      clearInterval(timerInterval);
      clearInterval(taTimerInterval);
      document.getElementById('options').innerHTML = '';
      document.getElementById('feedback').textContent = '';
      document.getElementById('gameOver').textContent = message;
      goToScreen(state.mode === 'normal' ? 'resultNormal' : 'resultTA');
      showAccuracy();   // totalAnswers===0なら内部でhide
      showMistakes();
      playSound(opts.soundName || 'fanfare');
    }

    // e. 正答率
    function showAccuracy() {
      const el = document.getElementById('accuracyDisplay');
      if (state.totalAnswers === 0) {
        el.style.display = 'none';
        return;
      }
      const pct = Math.round((state.correct / state.totalAnswers) * 100);
      el.textContent = `${state.totalAnswers}問中 ${state.correct}問せいかい（${pct}%）`;
      el.style.display = 'block';
    }

    function showMistakes() {
      const mistakesDiv = document.getElementById('mistakesList');
      mistakesDiv.style.display = 'block';
      let html = '<h3>まちがえたもんだい</h3><ul>';
      const keys = Object.keys(mistakeCounts);
      if (keys.length === 0) {
        html += '<li>まちがえたもんだいはありません！</li>';
      } else {
        keys.sort((a, b) => mistakeCounts[b] - mistakeCounts[a]).forEach(key => {
          const [a, b] = key.split('_').map(Number);
          // p. 一番多い誤答先を表示
          const wrong = topWrongAnswer(key);
          const wrongStr = wrong !== null ? ` <span class="wrong-target">→ よく ${wrong} とこたえる</span>` : '';
          html += `<li>${formatProblem(a, b)} = ${a * b}（${mistakeCounts[key]}回）${wrongStr}</li>`;
        });
      }
      html += '</ul>';
      mistakesDiv.innerHTML = html;
    }

    function topWrongAnswer(key) {
      const map = wrongAnswers[key];
      if (!map) return null;
      let best = null, bestCount = 0;
      for (const v in map) {
        if (map[v] > bestCount) { bestCount = map[v]; best = v; }
      }
      return best === null ? null : Number(best);
    }

    // ===== ヒートマップ =====
    let heatmapReturnTo = null;

    function showHeatmap() {
      heatmapReturnTo = () => goToScreen('modeSelect');
      goToScreen('heatmap');
      renderHeatmap();
    }

    function showHeatmapFromResult() {
      const returnScreen = state.mode === 'normal' ? 'resultNormal' : 'resultTA';
      heatmapReturnTo = () => {
        goToScreen(returnScreen);
        // 正答率が0なら隠す
        if (state.totalAnswers === 0) hide('accuracyDisplay');
      };
      goToScreen('heatmap');
      renderHeatmap();
    }

    function hideHeatmap() {
      if (heatmapReturnTo) {
        const cb = heatmapReturnTo;
        heatmapReturnTo = null;
        cb();
      } else {
        goToScreen('modeSelect');
      }
    }

    function renderHeatmap() {
      const container = document.getElementById('heatmapContainer');
      let html = '<table class="heatmap-table"><tr><th>×</th>';
      for (let j = 1; j <= 9; j++) html += `<th>${j}</th>`;
      html += '</tr>';

      let maxMistakes = 0;
      for (const k in mistakeCounts) {
        if (mistakeCounts[k] > maxMistakes) maxMistakes = mistakeCounts[k];
      }

      let hasWeakness = false;
      for (let i = 1; i <= 9; i++) {
        html += `<tr><td class="row-header">${i}</td>`;
        for (let j = 1; j <= 9; j++) {
          const count = mistakeCounts[mistakeKey(i, j)] || 0;
          if (count > 0) hasWeakness = true;
          const bg = heatmapColor(count, maxMistakes);
          const answer = i * j;
          const label = formatProblem(i, j);
          let title;
          if (count > 0) {
            const wrong = topWrongAnswer(mistakeKey(i, j));
            title = `${label} = ${answer}（${count}回まちがえ${wrong !== null ? ` / よく${wrong}とこたえる` : ''}）`;
          } else {
            title = `${label} = ${answer}`;
          }
          html += `<td style="background:${bg}" title="${title}">${answer}</td>`;
        }
        html += '</tr>';
      }
      html += '</table>';
      container.innerHTML = html;

      // d. 苦手がない時はボタン無効化
      const weakBtn = document.getElementById('weakOnlyBtn');
      weakBtn.disabled = !hasWeakness;
      weakBtn.style.opacity = hasWeakness ? '1' : '0.5';
      weakBtn.style.cursor = hasWeakness ? 'pointer' : 'not-allowed';
    }

    function heatmapColor(count, max) {
      if (count === 0 || max === 0) return '#e8f5e9';
      const ratio = count / Math.max(max, 1);
      if (ratio <= 0.33) return '#fff9c4';
      if (ratio <= 0.66) return '#ffcc80';
      return '#ef9a9a';
    }

    // ===== リセット =====
    function resetMistakeData() {
      try {
        localStorage.removeItem(CONFIG.STORAGE_KEYS.mistakes);
        localStorage.removeItem(CONFIG.STORAGE_KEYS.wrongAnswers);
      } catch (e) {}
      alert('リセットがかんりょうしました！');
      location.reload();
    }

    // ===== d. 苦手だけ練習開始 =====
    function startWeakOnlyPractice() {
      // 苦手な問題が無い場合は何もしない（ボタン側でdisabledにしてある）
      const hasWeak = Object.values(mistakeCounts).some(c => c > 0);
      if (!hasWeak) {
        alert('にがてなもんだいはまだありません！');
        return;
      }
      heatmapReturnTo = null;
      startNormalGame(CONFIG.WEAK_PRACTICE_TIME, { weakOnly: true });
    }

    // ===== まち描画 =====
    function drawCity(stage) {
      const cityDiv = document.getElementById('city');
      // PNGが読み込み済みなら使う
      if (cityImages[stage]) {
        cityDiv.innerHTML = '';
        const img = document.createElement('img');
        img.src = cityImages[stage].src;
        img.alt = `まちのようす ステージ${stage}`;
        cityDiv.appendChild(img);
        return;
      }
      // PNGがまだ読み込み中なら何も描かない（onloadで再描画される）
      // SVGフォールバックはPNG失敗が確定した場合のみ
      if (cityImageStatus[stage] !== 'failed') {
        cityDiv.innerHTML = '';
        return;
      }
      // ===== SVGフォールバック =====
      const w = 700, h = 300;
      let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
      svg += `<defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#87CEEB"/>
          <stop offset="100%" stop-color="#E0F7FA"/>
        </linearGradient>
      </defs>`;
      svg += `<rect width="${w}" height="${h}" fill="url(#sky)"/>`;
      svg += `<circle cx="600" cy="50" r="30" fill="#FFD54F"/>`;
      for (let a = 0; a < 360; a += 45) {
        const rad = a * Math.PI / 180;
        const x1 = 600 + Math.cos(rad) * 35;
        const y1 = 50 + Math.sin(rad) * 35;
        const x2 = 600 + Math.cos(rad) * 48;
        const y2 = 50 + Math.sin(rad) * 48;
        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>`;
      }
      if (stage >= 2) { svg += drawCloud(100, 40, 1); svg += drawCloud(350, 60, 0.8); }
      if (stage >= 5) { svg += drawCloud(500, 30, 0.7); }
      svg += `<rect x="0" y="230" width="${w}" height="70" fill="#81C784"/>`;
      svg += `<rect x="0" y="250" width="${w}" height="25" fill="#9E9E9E"/>`;
      svg += `<line x1="0" y1="262" x2="${w}" y2="262" stroke="#FFF" stroke-width="2" stroke-dasharray="20,15"/>`;

      const buildings = [
        { x: 300, w: 50, h: 50, color: '#FFAB91', roof: '#E64A19', type: 'house' },
        { x: 100, w: 55, h: 55, color: '#CE93D8', roof: '#7B1FA2', type: 'house' },
        { x: 480, w: 60, h: 60, color: '#80DEEA', roof: '#00838F', type: 'shop' },
        { x: 200, w: 50, h: 80, color: '#FFCC80', roof: '#EF6C00', type: 'apartment' },
        { x: 560, w: 80, h: 70, color: '#A5D6A7', roof: '#2E7D32', type: 'school' },
        { x: 50, w: 45, h: 100, color: '#90CAF9', roof: '#1565C0', type: 'building' },
        { x: 400, w: 0, h: 0, color: '#66BB6A', roof: '#33691E', type: 'park' },
        { x: 140, w: 50, h: 120, color: '#B0BEC5', roof: '#37474F', type: 'building' },
        { x: 340, w: 35, h: 140, color: '#EF9A9A', roof: '#C62828', type: 'tower' },
        { x: 430, w: 90, h: 110, color: '#FFF59D', roof: '#F9A825', type: 'castle' },
      ];
      for (let i = 0; i < Math.min(stage, buildings.length); i++) {
        svg += drawBuilding(buildings[i]);
      }
      if (stage >= 3) svg += drawTree(20, 230);
      if (stage >= 4) svg += drawTree(250, 228);
      if (stage >= 6) svg += drawTree(510, 232);
      if (stage >= 8) svg += drawTree(650, 228);
      svg += `</svg>`;
      cityDiv.innerHTML = svg;
    }

    function drawCloud(cx, cy, scale) {
      return `<g transform="translate(${cx},${cy}) scale(${scale})">
        <ellipse cx="0" cy="0" rx="40" ry="20" fill="white" opacity="0.9"/>
        <ellipse cx="-25" cy="5" rx="25" ry="15" fill="white" opacity="0.9"/>
        <ellipse cx="25" cy="5" rx="30" ry="18" fill="white" opacity="0.9"/>
      </g>`;
    }

    function drawTree(x, groundY) {
      const trunkH = 25;
      return `<rect x="${x-3}" y="${groundY-trunkH}" width="6" height="${trunkH}" fill="#795548"/>
        <circle cx="${x}" cy="${groundY-trunkH-12}" r="16" fill="#66BB6A"/>
        <circle cx="${x-10}" cy="${groundY-trunkH-5}" r="12" fill="#81C784"/>
        <circle cx="${x+10}" cy="${groundY-trunkH-5}" r="12" fill="#81C784"/>`;
    }

    function drawBuilding(b) {
      const groundY = 250;
      let svg = '';
      if (b.type === 'house') {
        const bx = b.x, by = groundY - b.h, bw = b.w, bh = b.h;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${b.color}"/>`;
        svg += `<polygon points="${bx-5},${by} ${bx+bw/2},${by-25} ${bx+bw+5},${by}" fill="${b.roof}"/>`;
        svg += `<rect x="${bx+bw/2-7}" y="${by+bh-22}" width="14" height="22" fill="#5D4037" rx="2"/>`;
        svg += `<rect x="${bx+6}" y="${by+10}" width="12" height="12" fill="#BBDEFB" rx="1"/>`;
        svg += `<rect x="${bx+bw-18}" y="${by+10}" width="12" height="12" fill="#BBDEFB" rx="1"/>`;
      }
      else if (b.type === 'shop') {
        const bx = b.x, by = groundY - b.h, bw = b.w, bh = b.h;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${b.color}"/>`;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="12" fill="${b.roof}"/>`;
        svg += `<rect x="${bx+5}" y="${by+14}" width="${bw-10}" height="14" fill="white" rx="2"/>`;
        svg += `<text x="${bx+bw/2}" y="${by+25}" text-anchor="middle" font-size="9" fill="${b.roof}">SHOP</text>`;
        svg += `<rect x="${bx+5}" y="${by+32}" width="${bw-10}" height="20" fill="#BBDEFB" rx="1"/>`;
      }
      else if (b.type === 'apartment' || b.type === 'building') {
        const bx = b.x, by = groundY - b.h, bw = b.w, bh = b.h;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${b.color}"/>`;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="6" fill="${b.roof}"/>`;
        const rows = Math.floor((bh - 15) / 18);
        const cols = Math.floor((bw - 10) / 16);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const wx = bx + 8 + c * 16;
            const wy = by + 12 + r * 18;
            svg += `<rect x="${wx}" y="${wy}" width="10" height="10" fill="#BBDEFB" rx="1"/>`;
          }
        }
      }
      else if (b.type === 'school') {
        const bx = b.x, by = groundY - b.h, bw = b.w, bh = b.h;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${b.color}"/>`;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="8" fill="${b.roof}"/>`;
        svg += `<circle cx="${bx+bw/2}" cy="${by+20}" r="10" fill="white" stroke="${b.roof}" stroke-width="2"/>`;
        svg += `<line x1="${bx+bw/2}" y1="${by+20}" x2="${bx+bw/2}" y2="${by+13}" stroke="${b.roof}" stroke-width="2"/>`;
        svg += `<line x1="${bx+bw/2}" y1="${by+20}" x2="${bx+bw/2+5}" y2="${by+20}" stroke="${b.roof}" stroke-width="1.5"/>`;
        for (let c = 0; c < 3; c++) {
          svg += `<rect x="${bx+10+c*24}" y="${by+38}" width="16" height="14" fill="#BBDEFB" rx="1"/>`;
        }
        svg += `<rect x="${bx+bw/2-10}" y="${by+bh-25}" width="20" height="25" fill="#5D4037" rx="2"/>`;
      }
      else if (b.type === 'park') {
        const px = b.x;
        svg += `<line x1="${px}" y1="${groundY-40}" x2="${px+30}" y2="${groundY-40}" stroke="#795548" stroke-width="3"/>`;
        svg += `<line x1="${px}" y1="${groundY}" x2="${px}" y2="${groundY-40}" stroke="#795548" stroke-width="2"/>`;
        svg += `<line x1="${px+30}" y1="${groundY}" x2="${px+30}" y2="${groundY-40}" stroke="#795548" stroke-width="2"/>`;
        svg += `<line x1="${px+10}" y1="${groundY-40}" x2="${px+8}" y2="${groundY-15}" stroke="#666" stroke-width="1.5"/>`;
        svg += `<line x1="${px+20}" y1="${groundY-40}" x2="${px+22}" y2="${groundY-15}" stroke="#666" stroke-width="1.5"/>`;
        svg += `<rect x="${px+4}" y="${groundY-16}" width="10" height="3" fill="#EF6C00" rx="1"/>`;
        svg += `<rect x="${px+18}" y="${groundY-16}" width="10" height="3" fill="#EF6C00" rx="1"/>`;
        svg += drawFlower(px + 45, groundY - 5);
        svg += drawFlower(px + 55, groundY - 3);
        svg += drawFlower(px + 50, groundY - 8);
      }
      else if (b.type === 'tower') {
        const bx = b.x, by = groundY - b.h, bw = b.w, bh = b.h;
        svg += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${b.color}"/>`;
        svg += `<line x1="${bx+bw/2}" y1="${by}" x2="${bx+bw/2}" y2="${by-20}" stroke="#666" stroke-width="2"/>`;
        svg += `<circle cx="${bx+bw/2}" cy="${by-22}" r="3" fill="red"/>`;
        const rows = Math.floor((bh - 10) / 16);
        for (let r = 0; r < rows; r++) {
          svg += `<rect x="${bx+8}" y="${by+8+r*16}" width="${bw-16}" height="9" fill="#BBDEFB" rx="1"/>`;
        }
      }
      else if (b.type === 'castle') {
        const bx = b.x, by = groundY - b.h, bw = b.w, bh = b.h;
        svg += `<rect x="${bx}" y="${by+15}" width="${bw}" height="${bh-15}" fill="${b.color}"/>`;
        const merlonW = bw / 7;
        for (let m = 0; m < 7; m += 2) {
          svg += `<rect x="${bx+m*merlonW}" y="${by}" width="${merlonW}" height="20" fill="${b.color}"/>`;
        }
        svg += `<rect x="${bx-8}" y="${by-10}" width="20" height="${bh+10}" fill="${b.roof}" opacity="0.7"/>`;
        svg += `<rect x="${bx+bw-12}" y="${by-10}" width="20" height="${bh+10}" fill="${b.roof}" opacity="0.7"/>`;
        svg += `<line x1="${bx+bw/2}" y1="${by}" x2="${bx+bw/2}" y2="${by-25}" stroke="#666" stroke-width="2"/>`;
        svg += `<polygon points="${bx+bw/2},${by-25} ${bx+bw/2+15},${by-19} ${bx+bw/2},${by-13}" fill="#F44336"/>`;
        svg += `<rect x="${bx+bw/2-12}" y="${by+bh-35}" width="24" height="35" fill="#5D4037" rx="12"/>`;
        svg += `<rect x="${bx+15}" y="${by+30}" width="12" height="16" fill="#BBDEFB" rx="6"/>`;
        svg += `<rect x="${bx+bw-27}" y="${by+30}" width="12" height="16" fill="#BBDEFB" rx="6"/>`;
      }
      return svg;
    }

    function drawFlower(x, y) {
      const colors = ['#E91E63', '#FF9800', '#9C27B0', '#F44336'];
      const c = colors[Math.abs(Math.round(x) + Math.round(y)) % colors.length];
      return `<circle cx="${x}" cy="${y}" r="3" fill="${c}"/>
        <line x1="${x}" y1="${y+3}" x2="${x}" y2="${y+10}" stroke="#4CAF50" stroke-width="1.5"/>`;
    }

    // ===== b. キーボード操作 =====
    function handleKeydown(e) {
      // 入力欄にフォーカスがある場合はスキップ
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (state.ended || state.waiting) return;
      const idx = ['1', '2', '3', '4'].indexOf(e.key);
      if (idx === -1) return;
      const buttons = document.querySelectorAll('#options .option');
      if (buttons[idx] && !buttons[idx].disabled) {
        buttons[idx].click();
      }
    }

    // ===== g. 初期セットアップ =====
    function setup() {
      // ミュート
      document.getElementById('muteBtn').addEventListener('click', () => setMuted(!isMuted));
      setMuted(isMuted);

      // モード選択
      document.querySelectorAll('#timeButtons .mode-btn').forEach(btn => {
        const t = Number(btn.dataset.time);
        btn.addEventListener('click', () => startNormalGame(t));
      });
      document.getElementById('startTABtn').addEventListener('click', startTimeAttack);
      document.getElementById('openHeatmapBtn').addEventListener('click', showHeatmap);

      // o. リトライ設定
      const retryEl = document.getElementById('retryOption');
      retryEl.checked = safeLoad(CONFIG.STORAGE_KEYS.retry, false) === true;
      state.retryOnWrong = retryEl.checked;
      document.getElementById('retryLabel').style.display = 'inline-block';
      retryEl.addEventListener('change', e => {
        state.retryOnWrong = e.target.checked;
        safeSave(CONFIG.STORAGE_KEYS.retry, state.retryOnWrong);
      });

      // 結果画面
      document.getElementById('quitBtn').addEventListener('click', quitGame);
      document.getElementById('restart').addEventListener('click', () => location.reload());
      document.getElementById('showHeatmapBtn').addEventListener('click', showHeatmapFromResult);
      document.getElementById('resetData').addEventListener('click', resetMistakeData);

      // ヒートマップ
      document.getElementById('hideHeatmapBtn').addEventListener('click', hideHeatmap);
      document.getElementById('weakOnlyBtn').addEventListener('click', startWeakOnlyPractice);

      // キーボード
      document.addEventListener('keydown', handleKeydown);

      // タッチでフォーカス残留を防止
      document.addEventListener('touchend', () => {
        if (document.activeElement && document.activeElement.classList.contains('option')) {
          document.activeElement.blur();
        }
      });

      refreshBestRecordDisplay();
      drawCity(state.cityStage);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setup);
    } else {
      setup();
    }
  </script>
</body>
</html>
